<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The wordmark can't survive a 16px browser tab, so the tab gets a monogram
       instead. Drawn as strokes rather than set as text: an SVG favicon renders
       without the page's webfonts, and a `font-family` here would fall back to
       whatever the OS happens to pick. -->
  <rect width="32" height="32" rx="9" fill="#000"/>
  <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.7 11.7 10.7 20"/>
    <path d="M14.9 11.7 8.7 25.3"/>
    <path d="M20.7 8.3v11.5a2.9 2.9 0 0 0 2.9 2.9h.6"/>
    <path d="M18 12.9h5.5"/>
  </g>
</svg>
